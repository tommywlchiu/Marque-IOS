# CI: every pull request and every push to main. A PR merges only when all
# four jobs pass (branch protection on main requires them).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Pitfalls & schema lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Known Pitfalls (scripts/check_pitfalls.py)
        run: python3 scripts/check_pitfalls.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anthropic output schemas (lint only, no API calls)
        run: node scripts/check-anthropic-schemas.js

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

  rules:
    name: Security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm test

  ios:
    name: iOS build & unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/spm
          key: spm-${{ hashFiles('Marque.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build and test (Simulator, Debug)
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)
          echo "Simulator: $SIM"
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Marque.xcodeproj -scheme Marque -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath ~/spm \
            -resultBundlePath build/Tests.xcresult \
            | tee build/xcodebuild.log | grep -E "error:|warning: unhandled|Test Case .* failed|Executed|\*\* (BUILD|TEST)"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/Tests.xcresult
            build/xcodebuild.log
          retention-days: 7
